<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>สมัครสมาชิก - 3D Tech</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* =========================================
           1. รีเซ็ตหน้าจอ & สไตล์พื้นฐาน
           ========================================= */
        html, body {
            margin: 0; padding: 0; width: 100%; min-height: 100vh;
            font-family: 'Prompt', sans-serif;
            background-color: #F8FAFC;
            overflow-x: hidden;
            top: 0px !important; /* สำหรับ Google Translate */
        }

        /* 🌐 สไตล์ปุ่มเปลี่ยนภาษา */
        .lang-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }

        .lang-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 50px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            color: #475569;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .lang-btn:hover {
            background: #eff6ff;
            border-color: #3b82f6;
            color: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.2);
        }

        .lang-btn i { transition: transform 0.8s ease; }
        .lang-btn:hover i { transform: rotate(360deg); }

        /* ซ่อน UI Google Translate */
        .goog-te-banner-frame.skiptranslate, .goog-te-gadget-icon { display: none !important; }
        #goog-gt-tt, .goog-tooltip, .goog-tooltip:hover { display: none !important; }
        .goog-text-highlight { background-color: transparent !important; border: none !important; box-shadow: none !important; }
        .skiptranslate iframe { display: none !important; }

        /* =========================================
           2. โครงสร้างการ์ดสมัครสมาชิก
           ========================================= */
        .reg-wrapper {
            display: flex; justify-content: center; align-items: center;
            width: 100%; min-height: 100vh; padding: 8vh 3vw; box-sizing: border-box;
        }

        .reg-card {
            background: #ffffff; width: 92%; max-width: 800px;
            padding: 40px 50px; border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.04);
            border: 1px solid #F1F5F9;
            box-sizing: border-box;
        }

        .reg-header { text-align: center; margin-bottom: 30px; }
        .reg-icon-box {
            width: 64px; height: 64px;
            background: #EFF6FF; color: #2563EB;
            border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 15px auto;
        }
        .reg-header h1 { margin: 0; font-size: 2rem; color: #1E293B; font-weight: 800; }
        .reg-header p { margin-top: 5px; color: #64748B; font-size: 0.95rem; }

        .reg-section-title {
            font-size: 1.1rem; font-weight: 700; color: #2563EB;
            border-bottom: 2px solid #F1F5F9; 
            padding-bottom: 10px; margin: 30px 0 20px 0;
        }

        .reg-grid { 
            display: grid; grid-template-columns: repeat(2, 1fr); 
            gap: 20px; width: 100%;
        }
        
        .reg-group { display: flex; flex-direction: column; width: 100%; position: relative; }
        .reg-group.full-width { grid-column: 1 / -1; }
        
        .reg-group label { font-size: 0.85rem; font-weight: 700; color: #475569; margin-bottom: 8px; }

        .reg-input, .reg-select {
            width: 100%; padding: 12px 16px; 
            border: 1px solid #E2E8F0; border-radius: 12px;
            font-size: 1rem; font-family: inherit;
            box-sizing: border-box; background: #F8FAFC; transition: 0.3s;
        }
        
        .reg-input.pr-10 { padding-right: 40px; }

        .reg-input:focus, .reg-select:focus {
            background: #fff; border-color: #2563EB; outline: none;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .reg-btn {
            width: 100%; padding: 16px;
            background: #2563EB; color: white; border: none; border-radius: 14px;
            font-size: 1.1rem; font-weight: 700; cursor: pointer;
            margin-top: 30px; transition: 0.3s;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }
        .reg-btn:hover { background: #1D4ED8; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3); }

        .reg-footer { text-align: center; margin-top: 25px; font-size: 0.95rem; color: #64748B; }
        .reg-footer a { color: #2563EB; text-decoration: none; font-weight: 700; }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 40px; 
            cursor: pointer;
            color: #94A3B8;
            transition: color 0.2s;
            background: transparent;
            border: none;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 24px;
        }
        .toggle-password:hover { color: #475569; }
        .toggle-password:focus { outline: none; }

        @media (max-width: 768px) {
            .reg-card { padding: 30px 25px; }
            .reg-grid { grid-template-columns: 100%; gap: 15px; }
            .reg-header h1 { font-size: 1.6rem; }
        }
    </style>
</head>
<body class="font-prompt">

    <div class="lang-container">
        <button onclick="toggleLanguage()" class="lang-btn group">
            <i data-lucide="globe" class="w-4 h-4"></i>
            <span id="lang-display">TH</span>
        </button>
    </div>

    <div class="reg-wrapper">
        <div class="reg-card">
            
            <div class="reg-header">
                <div class="reg-icon-box"><i data-lucide="user-plus" style="width: 32px; height: 32px;"></i></div>
                <h1>สร้างบัญชีใหม่</h1>
                <p>กรอกข้อมูลให้ครบถ้วนเพื่อความรวดเร็วในการจัดส่ง</p>
            </div>

            <form id="registerForm">
                
                <div class="reg-section-title">ข้อมูลบัญชี (Account)</div>
                <div class="reg-grid">
                    <div class="reg-group full-width">
                        <label>อีเมล <span style="color:red;">*</span></label>
                        <input type="email" id="reg-email" class="reg-input" placeholder="email@example.com" required>
                    </div>
                    
                    <div class="reg-group">
                        <label>รหัสผ่าน <span style="color:red;">*</span></label>
                        <input type="password" id="reg-password" class="reg-input pr-10" placeholder="อย่างน้อย 6 ตัวอักษร" minlength="6" required>
                        <button type="button" class="toggle-password" onclick="togglePasswordVisibility('reg-password', 'eye-icon-pass')">
                            <i data-lucide="eye-off" id="eye-icon-pass" class="w-5 h-5"></i>
                        </button>
                    </div>
                    
                    <div class="reg-group">
                        <label>ยืนยันรหัสผ่าน <span style="color:red;">*</span></label>
                        <input type="password" id="reg-confirm-password" class="reg-input pr-10" placeholder="กรอกรหัสผ่านอีกครั้ง" minlength="6" required>
                        <button type="button" class="toggle-password" onclick="togglePasswordVisibility('reg-confirm-password', 'eye-icon-confirm')">
                            <i data-lucide="eye-off" id="eye-icon-confirm" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>

                <div class="reg-section-title">ข้อมูลการจัดส่ง (Shipping Address)</div>
                <div class="reg-grid">
                    
                    <div class="reg-group">
                        <label>ชื่อ-นามสกุล ผู้รับ <span style="color:red;">*</span></label>
                        <input type="text" id="reg-name" class="reg-input" placeholder="เช่น สมชาย ใจดี" required>
                    </div>
                    
                    <div class="reg-group">
                        <label>เบอร์โทรศัพท์ <span style="color:red;">*</span></label>
                        <input type="tel" id="reg-phone" class="reg-input" placeholder="08xxxxxxxx" pattern="[0-9]{10}" required>
                    </div>

                    <div class="reg-group full-width">
                        <label>บ้านเลขที่ / หมู่ / อาคาร / ชั้น <span style="color:red;">*</span></label>
                        <input type="text" id="reg-house-no" class="reg-input" placeholder="เช่น 123/45 หมู่ 1 อาคารสุขสันต์ ชั้น 3" required>
                    </div>

                    <div class="reg-group">
                        <label>ซอย (ถ้ามี)</label>
                        <input type="text" id="reg-soi" class="reg-input" placeholder="เช่น ซอยสุขุมวิท 1">
                    </div>

                    <div class="reg-group">
                        <label>ถนน (ถ้ามี)</label>
                        <input type="text" id="reg-road" class="reg-input" placeholder="เช่น ถนนสุขุมวิท">
                    </div>

                    <div class="reg-group">
                        <label>ตำบล / แขวง <span style="color:red;">*</span></label>
                        <select id="reg-subdistrict" class="reg-select notranslate" disabled required>
                        </select>
                    </div>

                    <div class="reg-group">
                        <label>อำเภอ / เขต <span style="color:red;">*</span></label>
                        <select id="reg-district" class="reg-select notranslate" disabled required>
                        </select>
                    </div>

                    <div class="reg-group">
                        <label>จังหวัด <span style="color:red;">*</span></label>
                        <select id="reg-province" class="reg-select notranslate" required>
                        </select>
                        
                    </div>

                    <div class="reg-group">
                        <label>รหัสไปรษณีย์ <span style="color:red;">*</span></label>
                        <input type="text" id="reg-zip" class="reg-input notranslate" placeholder="ระบบจะกรอกให้อัตโนมัติ" readonly required>
                    </div>
                </div>

                <button type="submit" class="reg-btn" id="btn-submit">ยืนยันการสมัครสมาชิก</button>
            </form>

            <div class="reg-footer">
                มีบัญชีอยู่แล้ว? <a href="login.html">เข้าสู่ระบบที่นี่</a>
            </div>

        </div>
    </div>

    <div id="google_translate_element" style="display:none;"></div>

    <script type="text/javascript">
        function setLangCookie(lang) {
            document.cookie = "googtrans=/th/" + lang + "; path=/";
            document.cookie = "googtrans=/th/" + lang + "; domain=" + window.location.hostname + "; path=/";
            localStorage.setItem('my_site_lang', lang);
        }

        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'th', 
                includedLanguages: 'th,en',
                autoDisplay: false
            }, 'google_translate_element');
        }

        function toggleLanguage() {
            let currentLang = localStorage.getItem('my_site_lang') || 'th';
            let targetLang = currentLang === 'th' ? 'en' : 'th';
            setLangCookie(targetLang);
            window.location.reload(); 
        }

        document.addEventListener('DOMContentLoaded', () => {
            let savedLang = localStorage.getItem('my_site_lang') || 'th';
            let langDisplay = document.getElementById('lang-display');
            if (langDisplay) {
                langDisplay.innerText = savedLang.toUpperCase();
            }
        });

        // 💡 แก้บัค: เปิดตา = เห็นรหัส (eye), ปิดตา = ซ่อนรหัส (eye-off)
        function togglePasswordVisibility(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            
            if (input.type === "password") {
                input.type = "text";
                icon.setAttribute("data-lucide", "eye"); 
            } else {
                input.type = "password";
                icon.setAttribute("data-lucide", "eye-off"); 
            }
            
            lucide.createIcons();
        }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <script src="register.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
