<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ให้คะแนนสินค้า - 3D Tech</title>
    
    
    

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="rate.js"></script>
    
    <script> 
        lucide.createIcons(); 
        
        // 💡 ----------------------------------------------------
        // ระบบจัดการอัปโหลด "หลายรูป" อย่างสมบูรณ์แบบ
        // ----------------------------------------------------
        let selectedFiles = new DataTransfer(); // ใช้เก็บไฟล์แบบเชื่อมต่อกับ Input จริง

        function handleMultipleImages(input) {
            // เพิ่มไฟล์ใหม่ที่ลูกค้าเลือกลงใน DataTransfer
            for (let file of input.files) {
                selectedFiles.items.add(file);
            }
            
            // อัปเดตไฟล์กลับเข้าไปที่ input เดิม (เพื่อส่งค่าให้ rate.js ไปทำงานต่อ)
            input.files = selectedFiles.files;
            renderPreviews();
        }

        function renderPreviews() {
            const container = document.getElementById('image-preview-container');
            const addButton = document.getElementById('add-image-label');
            
            // เคลียร์รูปพรีวิวเก่าทิ้งก่อน (แต่เก็บปุ่มเพิ่มรูปเอาไว้)
            document.querySelectorAll('.preview-item').forEach(el => el.remove());

            const files = document.getElementById('review-image').files;
            
            Array.from(files).forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const div = document.createElement('div');
                    div.className = 'preview-item relative w-24 h-24 sm:w-32 sm:h-32 rounded-2xl border border-slate-200 overflow-hidden shrink-0 shadow-sm group';
                    
                    div.innerHTML = `
                        <img src="${e.target.result}" class="w-full h-full object-cover">
                        <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center backdrop-blur-[2px]">
                            <button type="button" onclick="removeImage(${index})" class="bg-red-500 text-white w-8 h-8 rounded-full flex items-center justify-center hover:bg-red-600 transition-transform active:scale-95 shadow-md">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                            </button>
                        </div>
                    `;
                    // แทรกรูปพรีวิวไป "ก่อน" ปุ่มเพิ่มรูป
                    container.insertBefore(div, addButton);
                }
                reader.readAsDataURL(file);
            });
        }

        function removeImage(indexToRemove) {
            const input = document.getElementById('review-image');
            const dt = new DataTransfer();
            
            // คัดลอกไฟล์ทั้งหมด ยกเว้นอันที่ถูกกดลบ
            Array.from(input.files).forEach((file, index) => {
                if (index !== indexToRemove) dt.items.add(file);
            });
            
            input.files = dt.files;
            selectedFiles = dt; // ซิงค์ค่าให้ตรงกัน
            renderPreviews(); // วาดพรีวิวใหม่
        }
    </script>
    <script src="i18n.js"></script>
    <script src="navbar.js"></script>
</body>
</html>
