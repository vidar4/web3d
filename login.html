<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - 3D Tech</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* จัดตำแหน่งตัวบอดี้ให้รองรับ Google Translate */
        body { top: 0px !important; }

        /* 🌐 สไตล์ปุ่มเปลี่ยนภาษา (White-Blue Minimalist) */
        .lang-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }

        .lang-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 50px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            color: #475569;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .lang-btn:hover {
            background: #eff6ff;
            border-color: #3b82f6;
            color: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.2);
        }

        .lang-btn i { transition: transform 0.8s ease; }
        .lang-btn:hover i { transform: rotate(360deg); }

        /* แสงเงาวิ่งพาดปุ่ม */
        .lang-btn::after {
            content: ""; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
            transform: skewX(-25deg); transition: 0.5s;
        }
        .lang-btn:hover::after { left: 200%; }

        /* ซ่อน UI ของ Google Translate */
        .goog-te-banner-frame.skiptranslate, .goog-te-gadget-icon { display: none !important; }
        #goog-gt-tt, .goog-tooltip, .goog-tooltip:hover { display: none !important; }
        .goog-text-highlight { background-color: transparent !important; border: none !important; box-shadow: none !important; }
        .skiptranslate iframe { display: none !important; }

        /* ปรับสี Logo Box ให้เป็นสีน้ำเงินหลัก */
        .login-logo-box { background: #2563EB !important; color: white; }
        .btn-login { background: #2563EB !important; }
        .btn-login:hover { background: #1D4ED8 !important; }

        /* 💡 สไตล์เพิ่มเติมสำหรับไอคอนตาเปิด/ปิดรหัสผ่าน */
        .password-toggle-btn {
            position: absolute;
            top: 50%;
            right: 12px;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            padding: 0;
            cursor: pointer;
            color: #94A3B8; /* สีเทาอ่อน */
            transition: color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        .password-toggle-btn:hover { color: #475569; /* สีเทาเข้มขึ้นเมื่อ hover */ }
        .password-toggle-btn:focus { outline: none; }
        
        /* ปรับช่อง input ให้มีพื้นที่ด้านขวาสำหรับไอคอน */
        .login-form-input#password { padding-right: 40px !important; }
    </style>
</head>
<body class="login-body font-prompt">

    <div class="lang-container">
        <button onclick="toggleLanguage()" class="lang-btn group">
            <i data-lucide="globe" class="w-4 h-4"></i>
            <span id="lang-display">TH</span>
        </button>
    </div>

    <main class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo-box">
                    <i data-lucide="box" style="width: 28px; height: 28px;"></i>
                </div>
                <h1 class="font-bold">3D TECH</h1>
                <p>ยินดีต้อนรับ</p>
            </div>

            <form id="loginForm">
                <div class="login-form-group">
                    <label for="email" class="font-semibold">อีเมล</label>
                    <input type="email" id="email" class="login-form-input" placeholder="admin@3dmodel.com" required>
                </div>

                <div class="login-form-group">
                    <label for="password" class="font-semibold">รหัสผ่าน</label>
                    <div class="relative w-full">
                        <input type="password" id="password" class="login-form-input w-full" placeholder="••••••••" required>
                        <button type="button" id="togglePassword" class="password-toggle-btn" title="เปิด/ปิดการมองเห็นรหัสผ่าน">
                            <i data-lucide="eye-off" id="eyeIcon" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-login login-btn font-bold">เข้าสู่ระบบ</button>
            </form>

            <div class="login-register-link">
                ยังไม่มีบัญชีใช่หรือไม่? <a href="register.html" class="text-blue-600 font-bold hover:underline">สมัครสมาชิกที่นี่</a>
            </div>
        </div>

        <footer class="login-footer">
            &copy; 2026 3D Tech Store System
        </footer>
    </main>

    <div id="google_translate_element" style="display:none;"></div>

    <script type="text/javascript">
        // 1. ฟังก์ชันตั้งค่า Cookie เพื่อจำภาษา
        function setLangCookie(lang) {
            document.cookie = "googtrans=/th/" + lang + "; path=/";
            document.cookie = "googtrans=/th/" + lang + "; domain=" + window.location.hostname + "; path=/";
            localStorage.setItem('my_site_lang', lang);
        }

        // 2. ตั้งค่าเริ่มต้น Google Translate
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'th', 
                includedLanguages: 'th,en',
                autoDisplay: false
            }, 'google_translate_element');
        }

        // 3. ฟังก์ชันสลับภาษา
        function toggleLanguage() {
            let currentLang = localStorage.getItem('my_site_lang') || 'th';
            let targetLang = currentLang === 'th' ? 'en' : 'th';
            setLangCookie(targetLang);
            window.location.reload(); 
        }

        // 4. แสดงผลภาษาปัจจุบันที่ปุ่ม
        document.addEventListener('DOMContentLoaded', () => {
            let savedLang = localStorage.getItem('my_site_lang') || 'th';
            let langDisplay = document.getElementById('lang-display');
            if (langDisplay) {
                langDisplay.innerText = savedLang.toUpperCase();
            }
        });
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <script> lucide.createIcons(); </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="login.js"></script>

</body>
</html>
